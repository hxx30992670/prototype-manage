server:
  port: 8080
  servlet:
    session:
      # Sliding idle timeout. Spring default is 30m, which logs users out after a short pause.
      timeout: ${SESSION_TIMEOUT:12h}
      cookie:
        name: PH_ADMIN_SESSION
        http-only: true
        same-site: lax
        path: /
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

spring:
  application:
    name: prototype-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prototype?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:prototype}
    password: ${SPRING_DATASOURCE_PASSWORD:prototype123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  bucket: ${MINIO_BUCKET:prototype-objects}
  root-user: ${MINIO_ROOT_USER:minio_admin}
  root-password: ${MINIO_ROOT_PASSWORD:minio_secret}
  upload-public-base-url: ${UPLOAD_PUBLIC_BASE_URL:http://prototype.corp.test/upload-objects}
