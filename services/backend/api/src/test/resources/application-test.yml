server:
  servlet:
    session:
      cookie:
        name: PH_ADMIN_SESSION
        http-only: true
        same-site: lax
        path: /
        secure: false

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
