global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prototype-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:8081']
        labels:
          service: prototype-api

  - job_name: preview-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['preview-gateway:8081']
        labels:
          service: preview-gateway

# 说明：publish-worker 按设计不开放 HTTP 端口，不暴露自身指标端点。
# 发布任务成功/失败/积压通过 API 侧 gauge（prototype_publish_jobs_*）监控。
