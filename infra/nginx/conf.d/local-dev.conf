server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name prototype.localhost prototype.local.test;

    client_max_body_size 1000m;

    location = /api { return 404; }
    location /api/ {
        proxy_pass http://host.docker.internal:18080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /upload-objects/ {
        limit_except PUT HEAD { deny all; }
        proxy_request_buffering off;
        proxy_pass http://minio:9000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /upload-objects { return 404; }
    location = /content { return 404; }
    location /content/ { return 404; }
    location = /minio { return 404; }
    location /minio/ { return 404; }

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src http://preview.localhost:18000 http://preview.local.test:18000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}

server {
    listen 80;
    server_name preview.localhost preview.local.test;

    location = /health {
        return 200 'preview-ok';
        add_header Content-Type text/plain;
    }

    location = /api { return 404; }
    location /api/ { return 404; }
    location = /upload-objects { return 404; }
    location /upload-objects/ { return 404; }
    location = /minio { return 404; }
    location /minio/ { return 404; }

    location /share-api/ {
        proxy_pass http://host.docker.internal:18080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /content/ {
        proxy_pass http://host.docker.internal:18082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src http://preview.localhost:18000 http://preview.local.test:18000; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
