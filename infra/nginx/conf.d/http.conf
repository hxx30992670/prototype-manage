server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name prototype.corp.test;

    client_max_body_size 1000m;

    location = /api {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /upload-objects/ {
        # 仅允许带有效签名的 PUT/HEAD，不开放桶列表、GET、DELETE 或管理控制台
        limit_except PUT HEAD { deny all; }
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log /var/log/nginx/upload_access.log credentials_safe;
        proxy_pass http://minio:9000/;
    }

    location = /upload-objects {
        return 404;
    }

    # MinIO Console 不属于业务入口，避免未知路径落到 SPA。
    location = /minio {
        return 404;
    }

    location /minio/ {
        return 404;
    }

    # 管理域禁止原型内容通道（预览 iframe 一律走预览域绝对地址）
    location = /content {
        return 404;
    }

    location /content/ {
        return 404;
    }

    location / {
        root /usr/share/nginx/html/web;
        try_files $uri /index.html;

        # 管理端可信页面安全头：原型内容在预览域沙箱，管理域静态页保持严格策略
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src http://preview.corp.test; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}

server {
    listen 80;
    server_name preview.corp.test;

    location = /health {
        return 200 'preview-ok';
        add_header Content-Type text/plain;
    }

    # 预览域拒绝全部管理 API（分享走 /share-api/），不得回退成前端页面
    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    # 预览域不承担上传职责，避免请求落到 SPA 或未来误接入 MinIO。
    location = /upload-objects {
        return 404;
    }

    location /upload-objects/ {
        return 404;
    }

    location = /minio {
        return 404;
    }

    location /minio/ {
        return 404;
    }

    location /share-api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /content/ {
        proxy_pass http://preview-gateway:8082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html/web;
        try_files $uri /index.html;

        # 预览域分享页安全头：分享页本身是可信页面，原型内容由其自身 CSP 约束
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src http://preview.corp.test; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
