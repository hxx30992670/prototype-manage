# Production HTTPS for ziyue.pingquyuedong.com:8989 and preview.pingquyuedong.com:8990.
# Do not bind 80/443 — those stay with existing apps on the host.

server {
    listen 8989 ssl default_server;
    listen 8990 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 8989 ssl;
    http2 on;
    server_name ziyue.pingquyuedong.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1000m;

    location = /api {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /upload-objects/ {
        limit_except PUT HEAD { deny all; }
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log /var/log/nginx/upload_access.log credentials_safe;
        proxy_pass http://minio:9000/;
    }

    location = /upload-objects {
        return 404;
    }

    location = /minio {
        return 404;
    }

    location /minio/ {
        return 404;
    }

    location = /content {
        return 404;
    }

    location /content/ {
        return 404;
    }

    location / {
        root /usr/share/nginx/html/web;
        try_files $uri /index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://preview.pingquyuedong.com:8990; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}

server {
    listen 8990 ssl;
    http2 on;
    server_name preview.pingquyuedong.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health {
        return 200 'preview-ok';
        add_header Content-Type text/plain;
    }

    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location = /upload-objects {
        return 404;
    }

    location /upload-objects/ {
        return 404;
    }

    location = /minio {
        return 404;
    }

    location /minio/ {
        return 404;
    }

    location /share-api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /content {
        return 404;
    }

    location /content/ {
        proxy_pass http://preview-gateway:8082;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        root /usr/share/nginx/html/web;
        try_files $uri /index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://preview.pingquyuedong.com:8990; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }
}
