user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $uri $redacted_uri {
        default $uri;
        ~*^(/s/)[^/]+(.*)$                      $1<redacted>$2;
        ~*^(/content/c/)[^/]+(.*)$              $1<redacted>$2;
        ~*^(/share-api/v1/shares/)[^/]+(.*)$    $1<redacted>$2;
        ~*^(/api/v1/downloads/)[^/]+(.*)$       $1<redacted>$2;
        ~*^(/share-api/v1/downloads/)[^/]+(.*)$ $1<redacted>$2;
    }

    log_format credentials_safe '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $redacted_uri $server_protocol" '
                                '$status $body_bytes_sent "$http_referer" '
                                '"$http_user_agent"';

    access_log /var/log/nginx/access.log credentials_safe;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
